services:
  drawfreely:
    build:
      context: .
      dockerfile: Dockerfile
    image: drawfreely:latest
    container_name: drawfreely
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    labels:
      - "app=drawfreely"
      - "maintainer=drawfreely"

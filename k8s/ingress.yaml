apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drawfreely
  labels:
    app.kubernetes.io/name: drawfreely
    app.kubernetes.io/part-of: drawfreely
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: drawfreely.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drawfreely
                port:
                  number: 80
  # Uncomment to enable TLS with cert-manager or existing secret:
  # tls:
  #   - hosts:
  #       - drawfreely.example.com
  #     secretName: drawfreely-tls

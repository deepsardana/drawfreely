apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawfreely
  labels:
    app.kubernetes.io/name: drawfreely
    app.kubernetes.io/part-of: drawfreely
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: drawfreely
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drawfreely
        app.kubernetes.io/part-of: drawfreely
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: drawfreely
          image: drawfreely:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
